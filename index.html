<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Васильев Павел — Фитнес-тренер</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            color: #1a1a1a;
            background: #fff;
        }

        /* HERO */
        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url('orig.jpeg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: white;
        }

        .hero-photo {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #fff;
            margin-bottom: 1.5rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .hero h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            font-weight: 700;
        }

        .hero-subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
            margin-bottom: 2rem;
            max-width: 500px;
        }

        .cta-btn {
            display: inline-block;
            padding: 1rem 2.5rem;
            background: #ff6b35;
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1.1rem;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 5px 20px rgba(255, 107, 53, 0.4);
        }

        .cta-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(255, 107, 53, 0.6);
        }

        /* СЕКЦИИ */
        section {
            padding: 4rem 1.5rem;
            max-width: 900px;
            margin: 0 auto;
        }

        .section-title {
            font-size: 2rem;
            margin-bottom: 2rem;
            text-align: center;
            color: #1a1a1a;
        }

        /* ОБО МНЕ */
        .about {
            background: #f7f7f7;
            max-width: 100%;
            padding: 4rem 1.5rem;
        }

        .about-content {
            max-width: 900px;
            margin: 0 auto;
            text-align: center;
        }

        .about-text {
            font-size: 1.1rem;
            margin-bottom: 2rem;
            color: #4a4a4a;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 2rem;
            margin-top: 2rem;
        }

        .stat {
            text-align: center;
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: 700;
            color: #ff6b35;
        }

        .stat-label {
            font-size: 0.9rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* ДЛЯ КОГО */
        .target-audience {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 4rem 1.5rem;
            text-align: center;
            max-width: 100%;
        }

        .target-audience h2 {
            color: white;
            margin-bottom: 1.5rem;
        }

        .target-text {
            font-size: 1.2rem;
            max-width: 800px;
            margin: 0 auto;
            line-height: 1.8;
        }

        /* КАК ПРОХОДЯТ ТРЕНИРОВКИ */
        .how-it-works {
            padding: 4rem 1.5rem;
            background: #fff;
            max-width: 100%;
        }

        .steps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 2rem;
            max-width: 1000px;
            margin: 3rem auto 0;
        }

        .step-card {
            text-align: center;
            padding: 2rem 1.5rem;
            background: #f7f7f7;
            border-radius: 15px;
            position: relative;
        }

        .step-number {
            width: 50px;
            height: 50px;
            background: #ff6b35;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0 auto 1rem;
        }

        .step-card h3 {
            margin-bottom: 0.5rem;
            color: #1a1a1a;
        }

        .step-card p {
            color: #666;
            font-size: 0.95rem;
        }

        /* УСЛУГИ С ЦЕНАМИ */
        .services-with-prices .service-card {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 280px;
        }

        .service-price {
            font-size: 1.5rem;
            font-weight: 700;
            color: #ff6b35;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 2px solid #e0e0e0;
        }

        .service-price span {
            font-size: 0.9rem;
            color: #666;
            font-weight: 400;
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
        }

        .service-card {
            padding: 2rem;
            background: #f7f7f7;
            border-radius: 15px;
            text-align: center;
            transition: transform 0.3s;
        }

        .service-card:hover {
            transform: translateY(-5px);
        }

        .service-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .service-card h3 {
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
        }

        /* ГАРАНТИИ */
        .guarantee {
            background: #fff3cd;
            border: 2px solid #ffc107;
            border-radius: 15px;
            padding: 2rem;
            text-align: center;
            margin: 3rem auto 0;
            max-width: 800px;
        }

        .guarantee-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .guarantee h3 {
            color: #856404;
            margin-bottom: 0.5rem;
        }

        .guarantee p {
            color: #856404;
            font-size: 1.1rem;
        }

        /* ГАЛЕРЕЯ */
        .gallery {
            background: #f7f7f7;
            max-width: 100%;
            padding: 4rem 1.5rem;
        }

        .gallery-grid {
            max-width: 900px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
        }

        .gallery-item {
            aspect-ratio: 1;
            border-radius: 10px;
            overflow: hidden;
            background: #ddd;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }

        .gallery-item:hover img {
            transform: scale(1.1);
        }

        /* ПРАЙС */
        .pricing-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
        }

        .price-card {
            padding: 2rem;
            background: #fff;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            text-align: center;
            transition: all 0.3s;
        }

        .price-card.featured {
            border-color: #ff6b35;
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(255, 107, 53, 0.2);
        }

        .price-card h3 {
            font-size: 1.3rem;
            margin-bottom: 1rem;
        }

        .price {
            font-size: 2.5rem;
            font-weight: 700;
            color: #ff6b35;
            margin-bottom: 0.5rem;
        }

        .price-features {
            list-style: none;
            margin: 1.5rem 0;
            text-align: left;
        }

        .price-features li {
            padding: 0.5rem 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .price-features li:before {
            content: "✓ ";
            color: #ff6b35;
            font-weight: bold;
        }

        /* ОТЗЫВЫ */
        .reviews {
            background: #f7f7f7;
            max-width: 100%;
            padding: 4rem 1.5rem;
        }

        .reviews-grid {
            max-width: 900px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .review-card {
            padding: 1.5rem;
            background: white;
            border-radius: 15px;
